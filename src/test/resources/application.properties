# ==========================================
# Test Configuration Overrides
# ==========================================
# Solo sobreescribe lo necesario para tests.
# El resto lo hereda de application.properties

# JWT - clave dummy para tests (no necesita ser real)
security.jwt.key.private=testSecretKeyForTestingPurposesOnly123456789
security.jwt.user.generator=AUTH0JWT-BACKEND-TEST

# Database - misma DB local para tests
spring.datasource.url=jdbc:postgresql://localhost:5432/empleos
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway - desactivado en tests
spring.flyway.enabled=false

# Server
server.port=0
server.servlet.context-path=

# Logging - silencioso en tests
logging.level.root=WARN
