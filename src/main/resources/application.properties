spring.application.name=Empleos-Backend

# ========================
# Database Configuration
# ========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/empleos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA/Hibernate Configuration
# ========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ========================
# Security / JWT Configuration
# ========================
security.jwt.key.private=${JWT_PRIVATE_KEY:defaultDevKeyChangeInProduction}
security.jwt.user.generator=${JWT_USER_GENERATOR:AUTH0JWT-BACKEND}

# ========================
# Server Configuration
# ========================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

# ========================
# Logging Configuration
# ========================
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.example.empleos=INFO

# ========================
# Flyway Configuration
# ========================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========================
# Swagger/OpenAPI Configuration
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
# ========================
# Jackson Configuration
# ========================
spring.jackson.serialization.fail-on-empty-beans=false